# Example deployment configuration template.
# Copy this file to ignored `config/deployment.local.toml` for local private
# overrides or real deployments, then replace the example values with real ones
# for the target environment.
#
# The repo also ships a ready-to-run tracked `config/deployment.toml` that
# defaults to no SMTP so local testing works immediately. Do not put real
# deployment secrets into the tracked file.

[app]
base_url = "http://localhost:3001"
allowed_domains_path = "config/allowed-domains.txt"

[admin]
# Required before first start. The app refuses to start while these are blank.
username = ""
password = ""
display_name = "Super Admin"

[smtp]
host = "smtp.company.example"
port = 587
user = "opa-voting-tool@company.example"
pass = "replace-with-real-smtp-password"
from = "opa-voting-tool@company.example"

[jira]
client_id = "your-atlassian-oauth-client-id"
client_secret = "replace-with-real-atlassian-client-secret"
cloud_id = ""
site_url = ""
site_name = ""
access_token = ""
refresh_token = ""
access_token_expires_at = ""

[branding]
login_logo = "/branding/login-logo.svg"
login_background = "/branding/login-background.svg"
team_logo = "/branding/team-logo.svg"
team_background = "/branding/team-background.svg"
background_opacity = 0.12
footer_creator_text = "Created by Example Team"
footer_company_text = "Example Company"
primary_action = "#3a88ff"
accent_highlight = "#579dff"
surface_tint = "#eff5fd"
text_emphasis = "#203047"

[demo]
enabled = false

[history_popup]
timezone_keys = "[\"gmt\",\"usa-davidson\",\"bulgaria-sofia\"]"
